<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>DLXR Tracker V5</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Exo+2:wght@300;600;800&display=swap" rel="stylesheet" />
  <style>
    /* ... (Le CSS reste identique, mais il faudra prévoir des styles pour générer plusieurs panneaux de télémétrie) ... */
    /* 🟢 POUR LE MULTI-ÉMETTEURS : Il faudra transformer #panel en conteneur (ex: #drones-container) et créer des classes génériques (.drone-panel) pour instancier un bloc par drone. */
    :root {
      --bg:        #0a0e1a;
      --panel:     #0f1628;
      --border:    #1e2d4a;
      --accent:    #00d4ff;
      --accent2:   #ff6b35;
      --green:     #00ff9d;
      --yellow:    #ffd700;
      --red:       #ff3b5c;
      --text:      #e0eeff;
      --muted:     #4a6080;
      --mono:      'Share Tech Mono', monospace;
      --sans:      'Exo 2', sans-serif;
    }
    /* ... (CSS omis pour la clarté, garde ton CSS existant) ... */
  </style>
</head>
<body>

  <header>
    <div class="logo">DL<span>X</span>R V5</div>
    <button id="ble-btn" onclick="connectBLE()">⚡ CONNECTER</button>
  </header>

  <div id="map"></div>
  <button id="center-btn" onclick="centerMap()" title="Centrer sur le drone">🎯</button>

  <!-- 🔴 MONO-ÉMETTEUR : L'interface est statique et codée en dur avec des ID uniques (ex: id="m-rssi"). -->
  <!-- 🟢 POUR LE MULTI-ÉMETTEURS : Ce #panel devra être vidé au départ. La fonction JS devra créer ces <div> dynamiquement avec document.createElement() pour chaque nouvel ID de drone reçu. -->
  <div id="panel">
    <div class="info-row">
      <span id="state-badge" class="state-badge">--</span>
      <span class="info-item" id="m-rssi">RSSI:--</span>
      <span class="info-item accent" id="m-alt">Alt.sol: -- m</span>
      <span class="info-item" id="m-rx">Tr.reçues:0</span>
    </div>
    <div class="info-row">
      <span class="info-label">Pos. Modèle</span>
      <span class="info-item accent" id="m-pos">Attente signal...</span>
      <span class="info-item accent" id="m-dist">-- m</span>
    </div>
    <div class="info-row">
      <span class="info-label">Home</span>
      <span class="info-item muted" id="m-mypos">Localisation...</span>
    </div>
    <div class="info-row">
      <span class="info-label">ID DGAC</span>
      <span class="info-item yellow" id="m-id">--</span>
    </div>
    <div id="status">EN ATTENTE DE CONNEXION BLE</div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const SERVICE_UUID = '4fafc201-1fb5-459e-8fcc-c5c9c331914b';
    const CHARACT_UUID = 'beb5483e-36e1-4688-b7f5-ea07361b26a8';

    let bleDevice = null, bleCharact = null;
    
    // 🔴 MONO-ÉMETTEUR : Variables globales uniques pour UN SEUL drone.
    // 🟢 POUR LE MULTI-ÉMETTEURS : Remplacer toutes ces variables par un objet global.
    // Exemple : 
    // let drones = {}; 
    // Ce qui donnera : drones["drone1"] = { rxCount: 0, marker: null, tracePath: [], polyline: null, lastLat: null, lastLon: null, linkLine: null };
    let rxCount = 0, droneMarker = null;
    let tracePath = [], polyline = null, linkLine = null;
    let autoCenter = true, lastLat = null, lastLon = null;
    
    // Variables du pilote (Celles-ci restent uniques car il n'y a qu'un seul smartphone/récepteur)
    let userMarker = null;
    let myLat = null, myLon = null;

    const map = L.map('map', { center: [48.8566, 2.3522], zoom: 15, zoomControl: false });
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '© OpenStreetMap', maxZoom: 19
    }).addTo(map);
    map.on('dragstart', () => { autoCenter = false; });

    // Icones Leaflet
    const droneIcon = L.divIcon({ /* ... */ });
    const userIcon = L.divIcon({ /* ... */ });

    function startGeolocation() {
      if (!navigator.geolocation) return;
      navigator.geolocation.watchPosition(pos => {
        myLat = pos.coords.latitude;
        myLon = pos.coords.longitude;
        if (!userMarker) {
          userMarker = L.marker([myLat, myLon], { icon: userIcon }).addTo(map);
          map.setView([myLat, myLon], 15); 
        } else {
          userMarker.setLatLng([myLat, myLon]);
        }
        document.getElementById('m-mypos').textContent = `${myLat.toFixed(6)}, ${myLon.toFixed(6)}`;
        
        // 🔴 MONO-ÉMETTEUR : Met à jour la ligne vers UN SEUL drone.
        // 🟢 POUR LE MULTI-ÉMETTEURS : Il faudra boucler sur l'objet `drones` pour mettre à jour la ligne de chaque drone vers le pilote.
        // Exemple : for (let id in drones) { updateLinkLine(id); }
        updateLinkLine();
      }, () => {}, { enableHighAccuracy: true, maximumAge: 2000 });
    }

    // 🟢 POUR LE MULTI-ÉMETTEURS : Ajouter un paramètre `droneId` -> function updateLinkLine(droneId)
    function updateLinkLine() {
      if (myLat === null || lastLat === null) return;
      const pts = [[myLat, myLon], [lastLat, lastLon]];
      if (linkLine) {
        linkLine.setLatLngs(pts);
      } else {
        linkLine = L.polyline(pts, { color: '#ffd700', weight: 1, opacity: 0.5, dashArray: '4 8' }).addTo(map);
      }
    }

    // 🔴 MONO-ÉMETTEUR : Cette fonction ne gère qu'un marqueur et qu'un tracé.
    // 🟢 POUR LE MULTI-ÉMETTEURS : Ajouter le paramètre `droneId` -> function updateMap(droneId, lat, lon)
    // Et utiliser drones[droneId].droneMarker, drones[droneId].tracePath, etc.
    function updateMap(lat, lon) {
      const latlng = [lat, lon];
      if (!droneMarker) {
        droneMarker = L.marker(latlng, { icon: droneIcon }).addTo(map);
        map.setView(latlng, 16);
      } else {
        droneMarker.setLatLng(latlng);
      }
      
      tracePath.push(latlng);
      if (polyline) {
        polyline.setLatLngs(tracePath);
      } else {
        polyline = L.polyline(tracePath, { color: '#00d4ff', weight: 2 }).addTo(map);
      }
      if (autoCenter) map.panTo(latlng);
      updateLinkLine();
    }

    // 🟢 POUR LE MULTI-ÉMETTEURS : Le centrage nécessitera de calculer le centre de tous les marqueurs (bounds) 
    // ou de cibler un drone spécifique (ex: drones[selectedDrone].lastLat).
    function centerMap() {
      autoCenter = true;
      if (lastLat !== null) map.setView([lastLat, lastLon], 16);
    }

    function handleData(json) {
      try {
        const d = JSON.parse(json);

        // 🟢 POUR LE MULTI-ÉMETTEURS : C'est ICI qu'il faut récupérer un identifiant. 
        // Ton ESP32 doit envoyer un ID dans le JSON (ex: {"id_drone": 1, "lat":..., "lon":...}).
        // const droneId = d.id_drone;
        // if (!drones[droneId]) { createNewDroneInUIAndMap(droneId); } // Initialise les variables et crée le HTML si nouveau drone.

        // Trame indicatif Alpha Tango
        if (d.id !== undefined) {
          document.getElementById('m-id').textContent = d.id;
          return;
        }

        // 🔴 MONO-ÉMETTEUR : On incrémente un compteur global.
        // 🟢 POUR LE MULTI-ÉMETTEURS : drones[droneId].rxCount++;
        rxCount++;
        
        const etat = (d.etat || '--').toUpperCase();
        const alt  = Math.max(0, parseFloat(d.alt  || 0)).toFixed(0);
        const dist = parseFloat(d.dist || 0);
        const rssi = parseFloat(d.rssi || 0).toFixed(0);
        const lat  = parseFloat(d.lat  || 0);
        const lon  = parseFloat(d.lon  || 0);
        const moved = d.moved !== false;

        // 🔴 MONO-ÉMETTEUR : Modification des éléments HTML via des ID fixes.
        // 🟢 POUR LE MULTI-ÉMETTEURS : Cibler l'élément spécifique au drone.
        // Exemple : document.getElementById(`m-alt-${droneId}`).textContent = ...
        const badge = document.getElementById('state-badge');
        badge.textContent = etat;
        badge.className   = 'state-badge ' + etat;

        document.getElementById('m-rssi').textContent = `RSSI:${rssi}`;
        document.getElementById('m-alt').textContent  = `Alt.sol:${alt}m`;
        document.getElementById('m-dist').textContent = dist < 1000 ? `${dist.toFixed(0)} m` : `${(dist / 1000).toFixed(2)} km`;
        document.getElementById('m-rx').textContent = `Tr.reçues:${rxCount}`;

        if (lat !== 0 && lon !== 0) {
          lastLat = lat; // 🟢 Remplacer par drones[droneId].lastLat = lat;
          lastLon = lon; // 🟢 Remplacer par drones[droneId].lastLon = lon;
          document.getElementById('m-pos').textContent = `${lat.toFixed(6)}, ${lon.toFixed(6)}`;
        }

        if (etat === 'GROUND' && !moved) {
          document.getElementById('m-pos').textContent = `AU SOL — ${lat.toFixed(6)}, ${lon.toFixed(6)}`;
          if (lat !== 0 && lon !== 0) updateMap(lat, lon); // 🟢 Passer le droneId : updateMap(droneId, lat, lon)
        } else {
          if (lat !== 0 && lon !== 0) updateMap(lat, lon); // 🟢 Passer le droneId : updateMap(droneId, lat, lon)
        }

      } catch(e) {
        setStatus('ERREUR PARSING JSON');
      }
    }

    // Le reste du code BLE reste intact car tu as toujours un seul récepteur (ESP32) connecté au téléphone.
    // L'ESP32 se chargera de recevoir les trames de plusieurs drones en LoRa et de toutes les transférer via cet unique lien BLE.
    async function connectBLE() { /* ... (identique) ... */ }
    function onDisconnected() { /* ... (identique) ... */ }
    function setStatus(msg) { document.getElementById('status').textContent = msg; }

    startGeolocation();
  </script>
</body>
</html>
